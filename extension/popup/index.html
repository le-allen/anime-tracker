<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Anime Episode Tracker</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section id="tracker-view" aria-labelledby="app-title">
        <header class="app-header">
          <div class="brand">
            <img src="../icons/icon.png" alt="" width="32" height="32">
            <div>
              <h1 id="app-title">Episode Tracker</h1>
              <p id="entry-summary">Loading your list…</p>
            </div>
          </div>
          <button id="open-search" class="primary-button" type="button">+ Add anime</button>
        </header>

        <div id="sync-notice" class="notice warning" role="status" hidden>
          Saved on this device. Firefox Sync will retry next time you open the tracker.
        </div>
        <div id="app-error" class="notice error" role="alert" hidden></div>

        <nav id="filters" class="filters" aria-label="Filter anime list">
          <button type="button" data-filter="all" aria-pressed="true">All</button>
          <button type="button" data-filter="watching" aria-pressed="false">Watching</button>
          <button type="button" data-filter="planned" aria-pressed="false">Planned</button>
          <button type="button" data-filter="completed" aria-pressed="false">Completed</button>
        </nav>

        <div id="anime-list" class="anime-list" aria-live="polite"></div>
        <div id="list-empty" class="empty-state" hidden>
          <div class="empty-icon" aria-hidden="true">▶</div>
          <h2>No anime here yet</h2>
          <p>Search AniList and add a show to start tracking your progress.</p>
          <button id="empty-add" class="primary-button" type="button">Add your first anime</button>
        </div>
      </section>

      <section id="search-view" aria-labelledby="search-title" hidden>
        <header class="search-header">
          <button id="close-search" class="icon-button" type="button" aria-label="Back to tracker">←</button>
          <div>
            <h1 id="search-title">Add anime</h1>
            <p>Search the AniList catalog</p>
          </div>
        </header>

        <label class="search-box">
          <span class="sr-only">Anime title</span>
          <span aria-hidden="true">⌕</span>
          <input id="search-input" type="search" placeholder="Try “Cowboy Bebop”" autocomplete="off" spellcheck="false">
        </label>

        <div id="search-status" class="search-status" role="status">Type at least 2 characters to search.</div>
        <div id="search-results" class="search-results"></div>
        <button id="retry-search" class="secondary-button retry-button" type="button" hidden>Try again</button>
      </section>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
